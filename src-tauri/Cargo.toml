[package]
name = "kanji-widget"
version = "1.3.0"
description = "Minimal Japanese kanji desktop widget"
authors = ["KanjiWidget"]
license = "Apache-2.0"
repository = "https://github.com/platwa/KanjiWidget"
homepage = "https://github.com/platwa/KanjiWidget"
edition = "2021"

[lib]
name = "kanji_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "0.2"
regex = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
tempfile = "3"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "0.13"

[dev-dependencies]
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
