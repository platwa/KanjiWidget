name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      microsoft_store:
        description: "Build the Microsoft Store offline NSIS installer"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows packages
        shell: pwsh
        run: |
          if ("${{ inputs.microsoft_store }}" -eq "true") {
            pnpm tauri build --config src-tauri/tauri.microsoftstore.conf.json
          } else {
            pnpm tauri build
          }

      - name: Stage release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $destination = Join-Path $PWD "release-output"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Tauri did not produce an NSIS package." }

          if ("${{ inputs.microsoft_store }}" -eq "true") {
            Copy-Item $setup.FullName (Join-Path $destination "KanjiWidget-$version-x64-MicrosoftStore-Setup.exe")
          } else {
            Copy-Item "src-tauri/target/release/kanji-widget.exe" (Join-Path $destination "KanjiWidget-$version-x64-Portable.exe")
            $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
            if (-not $msi) { throw "Tauri did not produce an MSI package." }
            Copy-Item $setup.FullName (Join-Path $destination "KanjiWidget-$version-x64-Setup.exe")
            Copy-Item $msi.FullName (Join-Path $destination "KanjiWidget-$version-x64.msi")
          }

          Get-ChildItem $destination -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 (Join-Path $destination "SHA256SUMS-$version.txt")

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.microsoft_store && 'KanjiWidget-MicrosoftStore-unsigned' || 'KanjiWidget-Windows-unsigned' }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
