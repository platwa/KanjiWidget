name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Windows packages
        run: pnpm tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $destination = Join-Path $PWD "release-output"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Copy-Item "src-tauri/target/release/kanji-widget.exe" (Join-Path $destination "KanjiWidget-$version-x64-Portable.exe")

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $setup -or -not $msi) { throw "Tauri did not produce both NSIS and MSI packages." }

          Copy-Item $setup.FullName (Join-Path $destination "KanjiWidget-$version-x64-Setup.exe")
          Copy-Item $msi.FullName (Join-Path $destination "KanjiWidget-$version-x64.msi")

          Get-ChildItem $destination -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 (Join-Path $destination "SHA256SUMS-$version.txt")

      - name: Upload unsigned release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KanjiWidget-Windows-unsigned
          path: release-output/*
          if-no-files-found: error
          retention-days: 30
