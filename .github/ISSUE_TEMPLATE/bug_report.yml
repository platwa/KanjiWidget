name: Bug report / Сообщить об ошибке
description: Report a reproducible problem in KanjiWidget / Сообщить о воспроизводимой ошибке
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve KanjiWidget. Спасибо, что помогаете улучшать KanjiWidget.

        Please do not attach private Anki decks or other personal study data. Не прикладывайте личные колоды Anki и другие приватные данные.
  - type: input
    id: version
    attributes:
      label: KanjiWidget version / Версия KanjiWidget
      placeholder: "1.4.1"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version / Версия Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Что произошло?
      description: Describe the problem and what you expected instead. / Опишите проблему и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как воспроизвести
      placeholder: |
        1. Open … / Открыть …
        2. Click … / Нажать …
        3. See … / Наблюдать …
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package / Вариант установки
      options:
        - Setup (.exe)
        - MSI
        - Portable
        - Built from source / Сборка из исходного кода
        - Not sure / Не знаю
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Screenshots or additional details / Скриншоты и подробности
      description: Add screenshots if they help, but remove personal information first. / Добавьте скриншоты при необходимости, предварительно удалив личные данные.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / Конфиденциальность
      options:
        - label: I removed private data from the report and attachments. / Я удалил(а) личные данные из текста и вложений.
          required: true
