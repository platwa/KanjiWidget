ShortDescription: Спокойный офлайн-виджет для изучения японских кандзи в Windows
Description: KanjiWidget показывает карточки с японскими кандзи на рабочем столе Windows и планирует повторения в стиле Anki по алгоритму FSRS. В приложении есть колоды JLPT N5/N4, примеры с фуриганой, редактируемые собственные колоды и прямой импорт текста из файлов Anki .apkg. Аккаунт, реклама, аналитика и телеметрия отсутствуют.
