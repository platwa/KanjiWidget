ShortDescription: A calm offline Windows widget for learning Japanese kanji
Description: KanjiWidget keeps Japanese kanji quietly visible on the Windows desktop and schedules Anki-style reviews with FSRS. It includes JLPT N5/N4 decks, examples with furigana, editable custom decks, and direct text-only import from Anki .apkg files. No account, advertising, analytics, or telemetry is required.
